<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #07090f;
    color: #e8eaf6;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* Subtle noise texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.4;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #07090f; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
  select, button, input { font-family: 'Inter', sans-serif; }
  select:focus, button:focus { outline: none; }
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .generate-btn-shine {
    background: linear-gradient(105deg, #c0392b 0%, #d4a20a 40%, #fff6 50%, #d4a20a 60%, #c0392b 100%);
    background-size: 200% auto;
    animation: shimmer 2.5s linear infinite;
    -webkit-background-clip: text;
    background-clip: text;
  }
</style>
</head>
<body>

<div id="root" style="position:relative;z-index:1;"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mc-components.jsx"></script>
<script type="text/babel" src="mc-randomizer.jsx"></script>

// ── Default tweaks ──────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#d4a20a",
  "cardSize": 190,
  "showDescriptions": true,
  "animationSpeed": "normal"
}/*EDITMODE-END*/;

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [activeTab, setActiveTab] = useState('randomizer');
  const [lang, setLang] = useState(() => localStorage.getItem('mc_lang') || 'es');
  const [collection, setCollection] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mc_collection')) || { campaigns:['core'], scenarioPacks:[], heroPacks:[] }; }
    catch { return { campaigns:['core'], scenarioPacks:[], heroPacks:[] }; }
  });
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mc_history')) || []; }
    catch { return []; }
  });
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => { localStorage.setItem('mc_collection', JSON.stringify(collection)); }, [collection]);
  useEffect(() => { localStorage.setItem('mc_history', JSON.stringify(history)); }, [history]);
  useEffect(() => { localStorage.setItem('mc_lang', lang); }, [lang]);

  const t = (key) => TR[lang][key] || key;

  const TABS = [
    { id:'randomizer', label: t('tabRandomizer'), icon:'⚡' },
    { id:'campaign',   label: t('tabCampaign'),   icon:'📖' },
    { id:'collection', label: t('tabCollection'), icon:'📦' },
    { id:'history',    label: t('tabHistory'),    icon:'📊' },
    { id:'progression',label: t('tabProgression'),icon:'📈' },
  ];

  const ctxValue = { collection, setCollection, history, setHistory, lang, t };

  return (
    <MCContext.Provider value={ctxValue}>
      <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>

        {/* Header */}
        <header style={{
          background: 'linear-gradient(180deg, #0d1020 0%, rgba(13,16,32,0.95) 100%)',
          borderBottom: '1px solid rgba(255,255,255,0.06)',
          position: 'sticky', top: 0, zIndex: 100,
          backdropFilter: 'blur(12px)'
        }}>
          {/* Top bar */}
          <div style={{ maxWidth:'1200px', margin:'0 auto', padding:'14px 20px', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px' }}>
            <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
              <div style={{ fontFamily:'"Bebas Neue",cursive', fontSize:'26px', letterSpacing:'0.08em', lineHeight:'1', color:'#f0f2ff', whiteSpace:'nowrap', display:'block' }}>
                <span style={{ color:tweaks.accentColor }}>Marvel </span>Champions
              </div>
              <div style={{ fontSize:'10px', color:'#424866', letterSpacing:'0.14em', textTransform:'uppercase', whiteSpace:'nowrap', display:'block' }}>{t('appSub')}</div>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
              <StatsBar />
              <button onClick={() => setLang(l => l==='es'?'en':'es')} style={{
                background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)',
                color:'#c0c8e8', borderRadius:'7px', padding:'7px 12px', fontSize:'13px',
                fontWeight:700, cursor:'pointer', letterSpacing:'0.04em'
              }}>{lang === 'es' ? 'EN' : 'ES'}</button>
            </div>
          </div>

          {/* Tab navigation */}
          <div style={{ maxWidth:'1200px', margin:'0 auto', padding:'0 20px', display:'flex', gap:'0', overflowX:'auto' }}>
            {TABS.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                background:'none', border:'none',
                borderBottom: activeTab===tab.id ? `2px solid ${tweaks.accentColor}` : '2px solid transparent',
                color: activeTab===tab.id ? tweaks.accentColor : '#5a6080',
                padding:'11px 16px', fontSize:'13px', fontWeight: activeTab===tab.id ? 700 : 400,
                cursor:'pointer', transition:'all 0.15s ease', whiteSpace:'nowrap',
                marginBottom:'-1px', display:'flex', alignItems:'center', gap:'6px',
                letterSpacing: activeTab===tab.id ? '0.01em' : '0'
              }}>
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </div>
        </header>

        {/* Main content */}
        <main style={{ flex:1, maxWidth:'1200px', width:'100%', margin:'0 auto', padding:'24px 20px' }}>
          {activeTab === 'randomizer'  && <RandomizerTab />}
          {activeTab === 'campaign'    && <CampaignTab />}
          {activeTab === 'collection'  && <CollectionTab />}
          {activeTab === 'history'     && <HistoryTab />}
          {activeTab === 'progression' && <ProgressionTab />}
        </main>

        {/* Footer */}
        <footer style={{ borderTop:'1px solid rgba(255,255,255,0.04)', padding:'14px 20px', textAlign:'center' }}>
          <div style={{ fontSize:'11px', color:'#2a2e48' }}>Marvel Champions: The Card Game © Fantasy Flight Games · Tool by community</div>
        </footer>
      </div>

      {/* Tweaks panel */}
      {showTweaks && (
        <TweaksPanel>
          <TweakSection label="Visual">
            <TweakColor label="Accent color" tweakKey="accentColor" value={tweaks.accentColor} onChange={v => setTweaks('accentColor', v)} />
            <TweakSlider label="Card width" tweakKey="cardSize" min={150} max={240} step={10} value={tweaks.cardSize} onChange={v => setTweaks('cardSize', v)} />
            <TweakToggle label="Show descriptions" tweakKey="showDescriptions" value={tweaks.showDescriptions} onChange={v => setTweaks('showDescriptions', v)} />
          </TweakSection>
          <TweakSection label="Animations">
            <TweakRadio label="Speed" tweakKey="animationSpeed" value={tweaks.animationSpeed}
              options={[{label:'Fast',value:'fast'},{label:'Normal',value:'normal'},{label:'Slow',value:'slow'}]}
              onChange={v => setTweaks('animationSpeed', v)} />
          </TweakSection>
        </TweaksPanel>
      )}
    </MCContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
